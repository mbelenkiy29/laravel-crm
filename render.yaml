# K3 Render blueprint. Docker web from this tree + private MySQL 8.0.40.
# APP_URL is the live Render hostname; first boot still prefers RENDER_EXTERNAL_URL if set.
services:
  - type: web
    name: krayin-crm
    runtime: docker
    plan: starter
    branch: 2.2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: krayin-storage
      mountPath: /var/www/html/storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://krayin-crm-c1gg.onrender.com
      - key: ASSET_URL
        value: https://krayin-crm-c1gg.onrender.com
      - key: APP_TIMEZONE
        value: America/New_York
      - key: TZ
        value: America/New_York
      - key: MAIL_MAILER
        value: log
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: krayin-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromService:
          name: krayin-mysql
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: DB_USERNAME
        fromService:
          name: krayin-mysql
          type: pserv
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          name: krayin-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: MYSQL_ROOT_PASSWORD
        fromService:
          name: krayin-mysql
          type: pserv
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: ADMIN_EMAIL
        value: mbelenkiy29@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: pserv
    name: krayin-mysql
    runtime: docker
    plan: starter
    branch: 2.2
    dockerfilePath: ./docker/mysql/Dockerfile
    dockerContext: ./docker/mysql
    disk:
      name: krayin-mysql
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: krayin
      - key: MYSQL_USER
        value: krayin
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_HOST
        value: "%"
